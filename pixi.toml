[workspace]
name = "fasthep-dev"
authors = ["FAST-HEP contributors"]
channels = ["conda-forge"]
platforms = ["linux-64"]
version = "0.1.0"

[dependencies]
python = ">=3.11"
pyyaml = "*"
packaging = "*"
hugo = ">=0.164.0,<0.165"

[environments]
scripts = ["scripts"]
dev = ["dev"]

[feature.scripts.dependencies]
python = ">=3.11"
pyyaml = "*"

[feature.dev.dependencies]
python = ">=3.11"
pytest = "*"
ruff = "*"
mypy = "*"
cupy = "*"
cuda-version = "12.6.*"


[feature.dev.pypi-dependencies]
fasthep-flow = { path = "flow", editable = true, extras = ["distributed"] }
fasthep-carpenter = { path = "carpenter", editable = true }
fasthep-curator = { path = "curator", editable = true }
fasthep-render = { path = "render", editable = true }
fasthep-cli = { path = "cli", editable = true }
fasthep-toolbench = { path = "toolbench", editable = true }
fasthep = { path = "fasthep", editable = true }
fasthep-workshop = { path = "workshop", editable = true }
cernopendata-client = {extras = ["pycurl", "xrootd"]}
uproot-browser = "*"
fsspec-xrootd = "*"

[feature.scripts.tasks]
status = "git submodule status --recursive"
update-submodules = "git submodule update --remote --recursive"
init-submodules = "git submodule update --init --recursive"
repo-index = "python scripts/dev/repo_index.py"
git-status = "python scripts/dev/git-status-summary.py"

release-plan = "python scripts/release/print_release_plan.py releases.json"
release-check = "python scripts/release/check_release.py releases.json"
release-check-flow = "python scripts/release/check_release.py releases.json --package flow"
release-update-versions = "python scripts/release/update_versions.py releases.json"
release-update-versions-dry = "python scripts/release/update_versions.py releases.json --dry-run"
release-tag = "python scripts/release/tag_packages.py releases.json"
release-tag-dry = "python scripts/release/tag_packages.py releases.json --dry-run"
release-tag-push = "python scripts/release/tag_packages.py releases.json --push"

smoke-submodules = "git submodule status --recursive"

clean-pycache = "find . -type d -name '__pycache__' -prune -exec rm -rf {} +"
clean-build = "find . \\( -name build -o -name dist -o -name '.pytest_cache' -o -name '.ruff_cache' -o -name '.mypy_cache' \\) -prune -exec rm -rf {} +"
clean-ai = "rm -rf .ai"
clean = { depends-on = ["clean-pycache", "clean-build"] }

[feature.dev.tasks]
smoke-imports = "python -c 'import hepflow, fasthep_carpenter, fasthep_curator, fasthep_render, fasthep_cli, fasthep_toolbench, fasthep, fasthep_workshop'"
smoke-runtime = "fasthep run workshop/examples/testing/runtime-smoke/author.yaml --outdir build/testing/runtime-smoke"
smoke-zmumu = "fasthep run workshop/examples/CMS/Zmumu/author.yaml --outdir build/CMS/Zmumu"

smoke-l1trigger = "fasthep run workshop/examples/CMS/L1Trigger/author.yaml --outdir build/CMS/L1Trigger"

smoke-workshop = { depends-on = [
  "smoke-runtime",
  "smoke-zmumu",
  "smoke-l1trigger",
] }

# -----------------------------------------------------------------------------
# fasthep-flow
# -----------------------------------------------------------------------------

test-flow = "pytest flow/tests"
lint-flow = "ruff check flow/src flow/tests"
typecheck-flow = "mypy --config-file flow/mypy.ini flow/src flow/tests"

# -----------------------------------------------------------------------------
# fasthep-carpenter
# -----------------------------------------------------------------------------

test-carpenter = "pytest carpenter/tests"
lint-carpenter = "ruff check carpenter/src carpenter/tests"
typecheck-carpenter = "mypy --config-file carpenter/mypy.ini carpenter/src carpenter/tests"

# -----------------------------------------------------------------------------
# fasthep-curator
# -----------------------------------------------------------------------------
test-curator = "pytest curator/tests"
lint-curator = "ruff check curator/src curator/tests"
typecheck-curator = "mypy --config-file curator/mypy.ini curator/src curator/tests"

# -----------------------------------------------------------------------------
# fasthep-render
# -----------------------------------------------------------------------------
test-render = "pytest render/tests"
lint-render = "ruff check render/src render/tests"
typecheck-render = "mypy --config-file render/mypy.ini render/src render/tests"

# -----------------------------------------------------------------------------
# fasthep-cli
# -----------------------------------------------------------------------------
test-cli = "pytest cli/tests"
lint-cli = "ruff check cli/src cli/tests"
typecheck-cli = "mypy --config-file cli/mypy.ini cli/src cli/tests"

# -----------------------------------------------------------------------------
# fasthep-toolbench
# -----------------------------------------------------------------------------
test-toolbench = "pytest toolbench/tests"
lint-toolbench = "ruff check toolbench/src toolbench/tests"
typecheck-toolbench = "mypy --config-file toolbench/pyproject.toml toolbench/src toolbench/tests"

# -----------------------------------------------------------------------------
# fasthep (meta package)
# -----------------------------------------------------------------------------
test-fasthep = "pytest fasthep/tests"
lint-fasthep = "ruff check fasthep/src fasthep/tests"
typecheck-fasthep = "mypy --config-file fasthep/mypy.ini fasthep/src fasthep/tests"

# -----------------------------------------------------------------------------
# aggregate tasks
# -----------------------------------------------------------------------------
test-all = { depends-on = [
  "test-flow",
  "test-carpenter",
  "test-curator",
  "test-render",
  "test-cli",
  "test-toolbench",
  "test-fasthep",
] }

lint-all = { depends-on = [
  "lint-flow",
  "lint-carpenter",
  "lint-curator",
  "lint-render",
  "lint-cli",
  "lint-toolbench",
  "lint-fasthep",
] }

typecheck-all = { depends-on = [
  "typecheck-flow",
  "typecheck-carpenter",
  "typecheck-curator",
  "typecheck-render",
  "typecheck-cli",
  "typecheck-toolbench",
  "typecheck-fasthep",
] }

ci = { depends-on = ["smoke-imports", "lint-all", "typecheck-all", "test-all"] }
