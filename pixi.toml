[workspace]
name = "fasthep-dev"
authors = ["FAST-HEP contributors"]
channels = ["conda-forge"]
platforms = ["linux-64"]
version = "0.1.0"
exclude-newer = "14d"

[dependencies]
python = ">=3.11"
pyyaml = "*"

[environments]
scripts = ["scripts"]
dev = ["dev"]

[feature.scripts.dependencies]
python = ">=3.11"
pyyaml = "*"

[feature.dev.dependencies]
python = ">=3.11"
pytest = "*"
ruff = "*"
mypy = "*"

[feature.dev.pypi-dependencies]
fasthep-flow = { path = "flow", editable = true }
fasthep-carpenter = { path = "carpenter", editable = true }
fasthep-curator = { path = "curator", editable = true }
fasthep-render = { path = "render", editable = true }
fasthep-cli = { path = "cli", editable = true }
fasthep-toolbench = { path = "toolbench", editable = true }
fasthep = { path = "fasthep", editable = true }
fasthep-workshop = { path = "workshop", editable = true }

[tasks]
status = "git submodule status --recursive"
update-submodules = "git submodule update --remote --recursive"
init-submodules = "git submodule update --init --recursive"
repo-index = "python scripts/dev/repo_index.py"
git-status = "python scripts/dev/git-status-summary.py"
smoke-imports = "python -c 'import hepflow, fasthep_carpenter, fasthep_curator, fasthep_render, fasthep_cli, fasthep_toolbench, fasthep, fasthep_workshop'"

release-plan = "python scripts/release/print_release_plan.py releases.json"
release-check = "python scripts/release/check_release.py releases.json"
release-check-flow = "python scripts/release/check_release.py releases.json --package flow"
release-update-versions = "python scripts/release/update_versions.py releases.json"
release-update-versions-dry = "python scripts/release/update_versions.py releases.json --dry-run"
release-tag = "python scripts/release/tag_packages.py releases.json"
release-tag-dry = "python scripts/release/tag_packages.py releases.json --dry-run"
release-tag-push = "python scripts/release/tag_packages.py releases.json --push"

smoke-submodules = "git submodule status --recursive"

smoke-runtime = "fasthep run workshop/examples/testing/runtime-smoke/author.yaml --outdir build/testing/runtime-smoke"
smoke-zmumu = "fasthep run workshop/examples/CMS/Zmumu/author.yaml --outdir build/CMS/Zmumu"

smoke-l1trigger = "fasthep run workshop/examples/CMS/L1Trigger/author.yaml --outdir build/CMS/L1Trigger"

smoke-workshop = { depends-on = [
  "smoke-runtime",
  "smoke-zmumu",
  "smoke-l1trigger",
] }

[tasks.clean-pycache]
cmd = """
find . -type d -name '__pycache__' -prune -exec rm -rf {} +
"""

[tasks.clean-build]
cmd = """
find . \\( -name build -o -name dist -o -name '.pytest_cache' -o -name '.ruff_cache' -o -name '.mypy_cache' \\) -prune -exec rm -rf {} +
"""

[tasks.clean-ai]
cmd = """
rm -rf .ai
"""

[tasks.clean]
depends-on = [
  "clean-pycache",
  "clean-build",
]

# -----------------------------------------------------------------------------
# fasthep-flow
# -----------------------------------------------------------------------------

[tasks.test-flow]
cmd = "pytest flow/tests"

[tasks.lint-flow]
cmd = "ruff check flow/src flow/tests"

[tasks.typecheck-flow]
cmd = "mypy --config-file flow/mypy.ini flow/src flow/tests"


# -----------------------------------------------------------------------------
# fasthep-carpenter
# -----------------------------------------------------------------------------

[tasks.test-carpenter]
cmd = "pytest carpenter/tests"

[tasks.lint-carpenter]
cmd = "ruff check carpenter/src carpenter/tests"

[tasks.typecheck-carpenter]
cmd = "mypy --config-file carpenter/mypy.ini carpenter/src carpenter/tests"


# -----------------------------------------------------------------------------
# fasthep-curator
# -----------------------------------------------------------------------------

[tasks.test-curator]
cmd = "pytest curator/tests"

[tasks.lint-curator]
cmd = "ruff check curator/src curator/tests"

[tasks.typecheck-curator]
cmd = "mypy --config-file curator/mypy.ini curator/src curator/tests"


# -----------------------------------------------------------------------------
# fasthep-render
# -----------------------------------------------------------------------------

[tasks.test-render]
cmd = "pytest render/tests"

[tasks.lint-render]
cmd = "ruff check render/src render/tests"

[tasks.typecheck-render]
cmd = "mypy --config-file render/mypy.ini render/src render/tests"


# -----------------------------------------------------------------------------
# fasthep-cli
# -----------------------------------------------------------------------------

[tasks.test-cli]
cmd = "pytest cli/tests"

[tasks.lint-cli]
cmd = "ruff check cli/src cli/tests"

[tasks.typecheck-cli]
cmd = "mypy --config-file cli/mypy.ini cli/src cli/tests"


# -----------------------------------------------------------------------------
# fasthep-toolbench
# -----------------------------------------------------------------------------

[tasks.test-toolbench]
cmd = "pytest toolbench/tests"

[tasks.lint-toolbench]
cmd = "ruff check toolbench/src toolbench/tests"

[tasks.typecheck-toolbench]
cmd = "mypy --config-file toolbench/pyproject.toml toolbench/src toolbench/tests"


# -----------------------------------------------------------------------------
# fasthep (meta package)
# -----------------------------------------------------------------------------

[tasks.test-fasthep]
cmd = "pytest fasthep/tests"

[tasks.lint-fasthep]
cmd = "ruff check fasthep/src fasthep/tests"

[tasks.typecheck-fasthep]
cmd = "mypy --config-file fasthep/mypy.ini fasthep/src fasthep/tests"


# -----------------------------------------------------------------------------
# aggregate tasks
# -----------------------------------------------------------------------------

[tasks.test-all]
depends-on = [
  "test-flow",
  "test-carpenter",
  "test-curator",
  "test-render",
  "test-cli",
  "test-toolbench",
  "test-fasthep",
]

[tasks.lint-all]
depends-on = [
  "lint-flow",
  "lint-carpenter",
  "lint-curator",
  "lint-render",
  "lint-cli",
  "lint-toolbench",
  "lint-fasthep",
]

[tasks.typecheck-all]
depends-on = [
  "typecheck-flow",
  "typecheck-carpenter",
  "typecheck-curator",
  "typecheck-render",
  "typecheck-cli",
  "typecheck-toolbench",
  "typecheck-fasthep",
]

[tasks.ci]
depends-on = [
  "smoke-imports",
  "lint-all",
  "typecheck-all",
  "test-all",
]
